<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AICRASHREPORT</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2b;
        --text: #edf6ff;
        --muted: #9bb0c7;
        --accent: #6ee7b7;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg), #1d293d);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(92vw, 720px);
        background: rgba(18, 26, 43, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        padding: 48px 32px;
        text-align: center;
      }

      .eyebrow {
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 700;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2.5rem, 6vw, 4rem);
        line-height: 1.1;
      }

      p {
        margin: 0 auto;
        max-width: 48ch;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">AI Crash Report</div>
      <h1>AICRASHREPORT</h1>
      <p>
        A minimal landing page for tracking and reviewing AI-related incidents,
        system failures, and actionable reporting insights.
      </p>
    </main>
  </body>
</html>
